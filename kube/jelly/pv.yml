apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-jellydata
  namespace: jelly
spec:
  capacity:
    storage: 5000Gi
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  nfs:
    server:   "bl-fb-nas03"
    #server: nfs-server
    #path: "cluster-volume/jellydata"
    path:     "/volume1/k3s-cluster/jellydata"

